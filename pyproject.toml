[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[project]
name = "latentra"
version = "0.1.0"
description = "Analysis of simulated manufacturing control measurements"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "joblib>=1.6.0",
    "kagglehub>=1.0.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "threadpoolctl>=3.8.0",
]
